[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geldalyse"
version = "0.1.0"
description = "Analyse et catégorisation de dépenses bancaires"
requires-python = ">=3.10"
dependencies = ["pandas", "streamlit", "numpy", "altair", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
